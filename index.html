<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospect Intelligence — Flávio Guedes</title>
<style>
  :root{
    --void:#050810;
    --panel:#0A1220;
    --panel-alt:#0D1830;
    --panel-line:rgba(99,169,255,0.16);
    --blue:#2F7FFF;
    --blue-bright:#6FB1FF;
    --blue-deep:#0B3B8C;
    --white:#F3F6FB;
    --mute:#8996AC;
    --mute-dim:#5C6880;
    --green:#3ED598;
    --purple:#C9A6FF;
    --orange:#FF8A66;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--void);color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .display{
    font-family:"Arial Narrow","Helvetica Neue Condensed","Roboto Condensed",Arial,sans-serif;
    font-weight:900;text-transform:uppercase;letter-spacing:-0.01em;
    transform:scaleX(1.06);transform-origin:left;
  }
  a{color:inherit;}
  button,input,select,textarea{font-family:inherit;}
  .node-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue-bright);box-shadow:0 0 8px 1px var(--blue-bright);margin-right:10px;vertical-align:middle;}
  .bracket{position:relative;}
  .bracket::before,.bracket::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--blue);opacity:0.8;}
  .bracket::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .bracket::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}

  .eyebrow{color:var(--blue-bright);font-size:12px;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;}
  .lede{color:var(--mute);font-size:14.5px;max-width:600px;}

  /* ---------- app shell ---------- */
  .app{display:flex;min-height:100vh;}

  .rail{
    width:250px;flex:0 0 250px;border-right:1px solid var(--panel-line);
    background:var(--panel-alt);display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto;transition:width 0.2s;
  }
  .rail.collapsed{width:64px;flex:0 0 64px;}
  .rail-head{padding:20px 18px;border-bottom:1px solid var(--panel-line);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .rail-brand{font-size:12px;letter-spacing:0.1em;line-height:1.35;}
  .rail-brand b{color:var(--blue-bright);display:block;}
  .rail-brand .tag{color:var(--mute-dim);font-size:10px;letter-spacing:0.12em;margin-top:3px;}
  .rail.collapsed .rail-brand{display:none;}
  .theme-toggle{
    background:none;border:1px solid var(--panel-line);color:var(--mute);
    width:28px;height:28px;flex:0 0 28px;cursor:pointer;font-size:13px;margin-left:6px;
  }
  .theme-toggle:hover{color:var(--white);border-color:var(--blue);}
  .rail-toggle{
    background:none;border:1px solid var(--panel-line);color:var(--mute);
    width:28px;height:28px;flex:0 0 28px;cursor:pointer;font-size:13px;
  }
  .rail-toggle:hover{color:var(--white);border-color:var(--blue);}
  .rail-group{padding:16px 0 4px;}
  .rail-group-label{padding:0 18px 8px;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--mute-dim);}
  .rail.collapsed .rail-group-label{display:none;}
  .rail-item{
    display:flex;align-items:center;gap:12px;width:100%;padding:10px 18px;
    background:none;border:none;border-left:2px solid transparent;
    color:var(--mute);font-size:13.5px;cursor:pointer;text-align:left;
  }
  .rail-item:hover{color:var(--white);background:rgba(99,169,255,0.05);}
  .rail-item.active{color:var(--white);border-left-color:var(--blue);background:rgba(47,127,255,0.08);font-weight:600;}
  .rail-item .ic{width:16px;text-align:center;color:var(--blue-deep);flex:0 0 16px;font-size:14px;}
  .rail-item.active .ic{color:var(--blue-bright);}
  .rail-item .rn{color:var(--mute-dim);font-size:10.5px;}
  .rail.collapsed .rail-item{justify-content:center;padding:12px 0;}
  .rail.collapsed .rail-item .lbl,.rail.collapsed .rail-item .rn{display:none;}

  .mobile-topbar{display:none;}
  .rail-backdrop{display:none;}
  .rail-backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:90;}

  .main-area{flex:1;min-width:0;padding:40px 44px 90px;max-width:1080px;}

  @media(max-width:900px){
    .app{flex-direction:column;}
    .rail{position:fixed;left:0;top:0;height:100vh;z-index:100;transform:translateX(-100%);transition:transform 0.2s;width:270px;}
    .rail.mobile-open{transform:translateX(0);}
    .mobile-topbar{
      display:flex;align-items:center;gap:14px;padding:16px 20px;
      border-bottom:1px solid var(--panel-line);position:sticky;top:0;
      background:rgba(5,8,16,0.94);z-index:50;backdrop-filter:blur(10px);
    }
    .mobile-topbar .rail-brand{font-size:12.5px;}
    .main-area{padding:24px 18px 60px;}
  }

  /* ---------- generic controls ---------- */
  .btn-primary{background:var(--blue);color:var(--void);border:none;padding:12px 22px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .btn-primary:hover{background:var(--blue-bright);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .front-link{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--blue-bright);border:1px solid var(--panel-line);padding:8px 14px;}
  .front-link:hover{border-color:var(--blue);}

  /* ---------- home / inteligência ---------- */
  .intel-hero{border:1px solid var(--panel-line);background:var(--panel);padding:38px;margin-bottom:32px;}
  .intel-hero h2{font-size:clamp(22px,3vw,30px);margin-bottom:10px;text-align:left;}
  .intel-hero p{color:var(--mute);margin-bottom:20px;max-width:580px;font-size:14.5px;}
  .research-form{display:flex;flex-direction:column;gap:10px;max-width:640px;}
  .research-form textarea{
    background:var(--void);border:1px solid var(--panel-line);color:var(--white);
    padding:12px 14px;font-size:13.5px;min-height:80px;resize:vertical;
  }
  .research-form textarea:focus{outline:none;border-color:var(--blue);}
  .hint{color:var(--mute-dim);font-size:11.5px;}
  .research-log{margin-top:10px;font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;gap:4px;}
  .research-log .err{color:var(--orange);}
  .research-log .ok{color:var(--green);}

  .stat-row{display:flex;gap:1px;background:var(--panel-line);border:1px solid var(--panel-line);margin-bottom:32px;flex-wrap:wrap;}
  .stat-box{flex:1;min-width:120px;background:var(--panel);padding:18px;}
  .stat-box .num{font-family:"Arial Narrow",Arial,sans-serif;font-weight:900;font-size:26px;color:var(--blue-bright);}
  .stat-box .lbl{color:var(--mute);font-size:11.5px;margin-top:4px;}

  .action-list{border:1px solid var(--panel-line);background:var(--panel);margin-bottom:32px;}
  .action-row{display:flex;gap:14px;align-items:flex-start;padding:14px 20px;border-bottom:1px solid var(--panel-line);font-size:13.5px;}
  .action-row:last-child{border-bottom:none;}
  .action-n{font-family:"Arial Narrow",Arial,sans-serif;font-weight:900;color:var(--blue-deep);font-size:15px;min-width:24px;}
  .signal-tag{font-size:10.5px;padding:4px 8px;border:1px solid var(--panel-line);color:var(--blue-bright);white-space:nowrap;}
  .signal-meta{color:var(--mute-dim);font-size:11.5px;margin-top:4px;}
  .contact-empty{padding:22px 20px;color:var(--mute-dim);font-size:13.5px;}

  /* ---------- opportunity cards ---------- */
  .opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:32px;}
  .opp-card{border:1px solid var(--panel-line);background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:10px;}
  .opp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .opp-card h4{font-size:15px;}
  .opp-card .setor{color:var(--mute);font-size:12px;}
  .fit-badge{font-family:"Arial Narrow",Arial,sans-serif;font-weight:900;font-size:15px;color:var(--blue-bright);border:1px solid rgba(111,177,255,0.4);padding:4px 8px;white-space:nowrap;}
  .resumo{color:var(--mute);font-size:13px;}
  .opp-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .opp-tag{font-size:10.5px;color:var(--mute);border:1px solid var(--panel-line);padding:3px 7px;}
  .opp-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap;}
  .opp-detail{border-top:1px solid var(--panel-line);margin-top:8px;padding-top:10px;display:flex;flex-direction:column;gap:8px;}
  .sinal-item{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--mute);}
  .sinal-item input{margin-top:3px;}
  .sinal-item.done{opacity:0.5;text-decoration:line-through;}
  .sinal-item a{color:var(--blue-bright);}

  /* ---------- radar filters ---------- */
  .filter-group{margin-bottom:16px;}
  .filter-group-label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--mute-dim);margin-bottom:8px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-chip{font-size:12px;padding:6px 12px;border:1px solid var(--panel-line);color:var(--mute);background:none;cursor:pointer;}
  .filter-chip.on{color:var(--blue-bright);border-color:var(--blue);background:rgba(47,127,255,0.08);}

  /* ---------- mini buttons / badges ---------- */
  .mini-btn{background:none;border:1px solid var(--panel-line);color:var(--mute);font-size:12px;padding:6px 10px;cursor:pointer;}
  .mini-btn:hover{color:var(--white);border-color:var(--blue);}
  .mini-btn.active-btn{color:var(--blue-bright);border-color:var(--blue);}
  .mini-btn.danger:hover{color:var(--orange);border-color:var(--orange);}
  .active-tag{font-size:10.5px;color:var(--void);background:var(--blue-bright);padding:2px 7px;letter-spacing:0.06em;text-transform:uppercase;margin-left:8px;}

  /* ---------- contacts panel (reused everywhere) ---------- */
  .contacts-panel{border:1px solid var(--panel-line);background:var(--panel);margin-top:20px;}
  .contacts-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:18px 22px;border-bottom:1px solid var(--panel-line);}
  .contacts-head h3{font-size:13px;letter-spacing:0.1em;text-transform:uppercase;}
  .stat-chips{display:flex;gap:10px;flex-wrap:wrap;}
  .stat-chip{font-size:11.5px;color:var(--mute);border:1px solid var(--panel-line);padding:5px 10px;white-space:nowrap;}
  .stat-chip b{color:var(--blue-bright);}
  .contact-form{display:flex;gap:10px;padding:18px 22px;border-bottom:1px solid var(--panel-line);flex-wrap:wrap;}
  .contact-form input,.contact-form select{
    background:var(--void);border:1px solid var(--panel-line);color:var(--white);
    padding:10px 12px;font-size:13.5px;flex:1;min-width:140px;
  }
  .contact-form input:focus,.contact-form select:focus{outline:none;border-color:var(--blue);}
  .contact-form button{background:var(--blue);color:var(--void);border:none;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;}
  .contact-form button:hover{background:var(--blue-bright);}
  .contact-list{padding:6px 0;}
  .contact-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--panel-line);}
  .contact-row:last-child{border-bottom:none;}
  .contact-row.is-active{background:rgba(47,127,255,0.07);}
  .contact-main{flex:1;min-width:150px;}
  .contact-name{font-size:14px;font-weight:600;}
  .contact-empresa{color:var(--mute);font-size:12.5px;}
  .status-badge,.nivel-badge{font-size:11px;letter-spacing:0.04em;padding:4px 9px;border:1px solid var(--panel-line);white-space:nowrap;}
  .status-nao_enviado{color:var(--mute);}
  .status-apresentacao,.status-follow1{color:var(--blue-bright);border-color:rgba(111,177,255,0.4);}
  .status-follow2{color:#F5B15A;border-color:rgba(245,177,90,0.4);}
  .status-respondeu{color:var(--green);border-color:rgba(62,213,152,0.4);}
  .nivel-leve{color:var(--mute);}
  .nivel-consultivo{color:var(--purple);border-color:rgba(201,166,255,0.4);}
  .nivel-aguardar{color:var(--orange);border-color:rgba(255,138,102,0.4);}
  .due-badge{font-size:11px;color:var(--orange);border:1px solid rgba(255,138,102,0.4);padding:4px 9px;white-space:nowrap;}
  .last-sent{color:var(--mute-dim);font-size:11.5px;white-space:nowrap;}
  .contact-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .contact-actions select{background:var(--void);color:var(--white);border:1px solid var(--panel-line);font-size:12px;padding:6px 8px;}

  .checklist-block{width:100%;border:1px solid var(--panel-line);padding:14px;margin-top:4px;}
  .checklist-title{font-size:11.5px;color:var(--mute-dim);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
  .check-row{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--mute);margin-bottom:8px;cursor:pointer;}
  .check-row input{margin-top:2px;}
  .nivel-preview{font-size:12.5px;margin-top:6px;padding-top:10px;border-top:1px solid var(--panel-line);}
  .nivel-preview b{color:var(--blue-bright);}

  .warn-banner{border:1px solid rgba(255,138,102,0.4);background:rgba(255,138,102,0.06);color:var(--orange);padding:14px 18px;font-size:13px;margin-bottom:16px;}
  .case-builder{border:1px solid var(--panel-line);background:var(--panel);padding:20px;margin-bottom:20px;}
  .case-builder h4{font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue-bright);margin-bottom:12px;}
  .case-field{margin-bottom:14px;}
  .case-field label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;}
  .case-field textarea{width:100%;background:var(--void);border:1px solid var(--panel-line);color:var(--white);padding:10px 12px;font-size:13px;min-height:60px;resize:vertical;}
  .case-field textarea:focus{outline:none;border-color:var(--blue);}

  /* ---------- messages cards ---------- */
  .front-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:26px;padding-bottom:4px;}
  .front-chip{flex:0 0 auto;padding:9px 14px;border:1px solid var(--panel-line);color:var(--mute);font-size:12.5px;white-space:nowrap;background:none;cursor:pointer;}
  .front-chip.active{color:var(--white);border-color:var(--blue);background:rgba(47,127,255,0.1);}
  .front-chip.special{color:var(--blue-bright);}
  .front-head{margin-bottom:24px;}
  .front-title{font-size:clamp(22px,3vw,30px);margin-bottom:8px;}
  .front-desc{color:var(--mute);font-size:14px;max-width:600px;}
  .cards{display:flex;flex-direction:column;gap:20px;margin-bottom:8px;}
  .card{background:var(--panel);border:1px solid var(--panel-line);}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--panel-line);flex-wrap:wrap;gap:8px;}
  .card-head h3{font-size:13px;letter-spacing:0.1em;text-transform:uppercase;}
  .card-head h3 span{color:var(--blue-bright);}
  .copy-btn{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--blue);color:var(--void);border:none;font-size:13px;font-weight:700;cursor:pointer;}
  .copy-btn:hover{background:var(--blue-bright);}
  .copy-btn.copied{background:var(--green);color:var(--void);}
  .card-body{padding:22px;white-space:pre-wrap;color:var(--white);font-size:14.5px;line-height:1.7;}

  /* ---------- kanban ---------- */
  .kanban{display:flex;gap:1px;background:var(--panel-line);border:1px solid var(--panel-line);overflow-x:auto;}
  .kcol{flex:1;min-width:190px;background:var(--panel);}
  .kcol-head{padding:14px 16px;border-bottom:1px solid var(--panel-line);font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--mute);}
  .kcol-head b{color:var(--blue-bright);}
  .kcard{margin:10px;padding:12px;border:1px solid var(--panel-line);background:var(--void);font-size:12.5px;cursor:pointer;}
  .kcard:hover{border-color:var(--blue);}
  .kname{font-weight:600;color:var(--white);}
  .kmeta{color:var(--mute-dim);font-size:11px;margin-top:3px;}

  /* ---------- warm-up ---------- */
  .warm-checks{display:flex;gap:14px;flex-wrap:wrap;}
  .warm-checks label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);cursor:pointer;}

  /* ---------- content ideas ---------- */
  .idea-card{border:1px solid var(--panel-line);background:var(--panel);padding:16px 18px;margin-bottom:10px;}
  .idea-card h5{font-size:14px;margin-bottom:6px;}
  .idea-card p{color:var(--mute);font-size:13px;}

  /* ---------- canais ---------- */
  .canal-card{border:1px solid var(--panel-line);background:var(--panel);padding:22px;margin-bottom:14px;}
  .canal-card h4{font-size:15px;margin-bottom:6px;}
  .canal-card p{color:var(--mute);font-size:13.5px;margin-bottom:10px;}
  .section-sub{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--mute-dim);margin:32px 0 14px;}
  .channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .channel-card{border:1px solid var(--panel-line);background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:10px;}
  .channel-card h5{font-size:14px;}
  .channel-block-label{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue-bright);margin-bottom:4px;}
  .channel-block p{color:var(--mute);font-size:12.5px;}
  .channel-block ul{list-style:none;display:flex;flex-direction:column;gap:3px;}
  .channel-block li{color:var(--mute);font-size:12.5px;padding-left:12px;position:relative;}
  .channel-block li::before{content:"·";position:absolute;left:0;color:var(--blue-deep);}

  /* ---------- funil aquecimento ---------- */
  .funnel-row{display:flex;gap:10px;align-items:stretch;margin-bottom:28px;flex-wrap:wrap;}
  .funnel-step{flex:1;min-width:110px;border:1px solid var(--panel-line);background:var(--panel);padding:14px 12px;text-align:center;}
  .funnel-step .fn-num{font-family:"Arial Narrow",Arial,sans-serif;font-weight:900;font-size:22px;color:var(--blue-bright);}
  .funnel-step .fn-lbl{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;}
  .funnel-arrow{display:flex;align-items:center;color:var(--mute-dim);font-size:16px;flex:0 0 auto;}
  @media(max-width:900px){ .funnel-arrow{display:none;} }
  .nivel-pill{font-size:10.5px;padding:3px 8px;border:1px solid var(--panel-line);color:var(--mute);white-space:nowrap;}

  /* ---------- ganchos ---------- */
  .gancho-card{border:1px solid var(--panel-line);background:var(--panel);padding:18px 20px;margin-bottom:12px;}
  .gancho-cat{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--blue-bright);margin-bottom:6px;}
  .gancho-titulo{font-size:14.5px;font-weight:600;margin-bottom:6px;}
  .gancho-texto{color:var(--mute);font-size:13px;}

  /* ---------- plano de prospecção ---------- */
  .plano-card{border:1px solid var(--panel-line);background:var(--panel);padding:28px;margin-bottom:32px;}
  .plano-row{display:flex;gap:8px 24px;flex-wrap:wrap;margin-bottom:16px;}
  .plano-block{flex:1;min-width:200px;}
  .plano-block .pb-lbl{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--mute-dim);margin-bottom:6px;}
  .plano-block .pb-val{font-size:13.5px;color:var(--white);}
  .plano-nums{display:flex;gap:1px;background:var(--panel-line);border:1px solid var(--panel-line);margin:18px 0;flex-wrap:wrap;}
  .plano-num-box{flex:1;min-width:110px;background:var(--void);padding:14px;text-align:center;}
  .plano-num-box .num{font-family:"Arial Narrow",Arial,sans-serif;font-weight:900;font-size:22px;color:var(--blue-bright);}
  .plano-num-box .lbl{color:var(--mute);font-size:10.5px;margin-top:3px;text-transform:uppercase;}
  .canal-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;color:var(--mute);}
  .canal-bar-name{width:80px;flex:0 0 80px;}
  .canal-bar-track{flex:1;height:8px;background:var(--void);border:1px solid var(--panel-line);}
  .canal-bar-fill{height:100%;background:var(--blue);}

  /* ---------- modal: painel do prospect ---------- */
  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(2,4,10,0.72);z-index:200;padding:26px;overflow-y:auto;}
  .modal-backdrop.show{display:flex;justify-content:center;align-items:flex-start;}
  .modal-panel{background:var(--panel);border:1px solid var(--panel-line);max-width:620px;width:100%;margin:20px auto;padding:0;}

// STORAGE WRAPPER V7 — localStorage fallback + export/import
// =========================================================
const Storage = {
  async get(key, meta){
    try{
      const raw = localStorage.getItem('prospect_'+key);
      if(raw===null) return {value:null};
      return {value: raw};
    }catch(e){ return {value:null}; }
  },
  async set(key, value, meta){
    try{ localStorage.setItem('prospect_'+key, String(value)); }catch(e){ console.error('Storage set failed', e); }
  },
  async remove(key){
    try{ localStorage.removeItem('prospect_'+key); }catch(e){}
  }
};
window.storage = Storage;

function exportAll(){
  const data = {
    version:'V7',
    exportedAt: new Date().toISOString(),
    contacts: state.contacts,
    radar: state.radar,
    contentIdeas: state.contentIdeas,
    settings: { activeFrontId: state.activeFrontId, railCollapsed: state.railCollapsed }
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'prospect-intelligence-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
}
function importAll(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data.contacts || !data.radar) throw new Error('Formato inválido');
      state.contacts = data.contacts || {};
      state.radar = data.radar || [];
      state.contentIdeas = data.contentIdeas || [];
      if(data.settings){
        state.activeFrontId = data.settings.activeFrontId || state.activeFrontId;
        state.railCollapsed = data.settings.railCollapsed || state.railCollapsed;
      }
      saveContacts(); saveRadar(); saveIdeas();
      alert('Importação concluída com sucesso!');
      renderSection();
    }catch(err){ alert('Erro na importação: '+err.message); }
  };
  reader.readAsText(file);
}

async function loadAll(){
  try{
    const [c,r,i] = await Promise.all([
      window.storage.get('contacts-data', false).catch(()=>null),
      window.storage.get('radar-data', false).catch(()=>null),
      window.storage.get('content-ideas', false).catch(()=>null)
    ]);
    state.contacts = c && c.value ? JSON.parse(c.value) : {};
    Object.keys(state.contacts).forEach(fid=>{ state.contacts[fid] = state.contacts[fid].map(normalizeContact); });
    state.radar = r && r.value ? JSON.parse(r.value) : [];
    state.contentIdeas = i && i.value ? JSON.parse(i.value) : [];
  }catch(e){
    state.contacts = state.contacts || {};
    state.radar = state.radar || [];
    state.contentIdeas = state.contentIdeas || [];
  }
  state.storageReady = true;
  renderSection();
}

function formatLastSent(iso){

function potencialFromOpp(o){
  if(!o) return '-';
  const fit = o.fitScore||0;
  if(fit>=70) return 'Alto';
  if(fit>=40) return 'Médio';
  return 'Baixo';
}
function inferPresenca(o){
  const domains = new Set();
  (o&&o.sinais||[]).forEach(s=>{
    if(!s.fonte) return;
    try{
      const host = new URL(s.fonte).hostname.replace('www.','');
      if(host.includes('linkedin')) domains.add('LinkedIn');
      else if(host.includes('youtube')) domains.add('YouTube');
      else if(host.includes('instagram')) domains.add('Instagram');
      else domains.add(host);
    }catch(e){}
  });
  return Array.from(domains);
}

function copyText(text, btn){

    btn.textContent = 'Copiado!'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else { fallbackCopy(text, done); }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); cb();
}

function opportunitiesActive(){ return state.radar.filter(o=>o.status!=='descartado'); }

function buildResearchPrompt(query){
  return `Você é um analista de inteligência comercial. Pesquise informações reais e atuais na web sobre: "${query}".

Procure sinais concretos de oportunidade comercial: vagas abertas (principalmente marketing, comunicação, criação, produto), lançamento de produto, expansão, crescimento, investimento em mídia, mudança de posicionamento de marca, estruturação de IA, criação de área de conteúdo, rodada de investimento captado, abertura de novas unidades.

Regras importantes:
- Só inclua sinais que você realmente encontrou na busca. Se não encontrar nada relevante, retorne sinais como lista vazia.
- Não invente nomes de pessoas, vagas ou notícias. Se não souber o nome de um decisor, use o CARGO provável, nunca um nome inventado.
- Cite a fonte (URL) de cada sinal quando disponível.
- No máximo 4 sinais, descrições curtas (até 20 palavras cada).

Responda apenas com um JSON válido, sem texto antes ou depois, neste formato exato:
{"empresa":"nome pesquisado","setor":"setor ou segmento","resumo":"até 2 frases sobre o momento atual","sinais":[{"tipo":"contratacao|crescimento|lancamento_produto|mudanca_posicionamento|investimento_midia|estruturando_ia|criando_conteudo|expansao|investimento_captado|outro","descricao":"...","potencial":"alto|medio|baixo","area":"...","decisor_provavel":"cargo, nunca nome inventado","acao_recomendada":"...","fonte":"URL ou vazio"}],"fit_estimado":0,"fit_justificativa":"..."}`;
}

function matchSegmento(setor){
  const low = (setor||'').toLowerCase();
  const found = SEGMENTOS.filter(s=>low.includes(s.toLowerCase()));
  return found.length ? found : (setor ? [setor] : []);
}
function matchPerfil(decisor){
  if(!decisor) return null;
  const low = decisor.toLowerCase();
  return PERFIS.find(p=>low.includes(p.toLowerCase()) || p.toLowerCase().includes(low)) || decisor;
}
function normalizeOpportunity(parsed, query){
  const sinais = (parsed.sinais||[]).map(s=>({
    tipo:s.tipo||'outro', descricao:s.descricao||'', potencial:s.potencial||'medio',
    area:s.area||'', decisor_provavel:s.decisor_provavel||'', acao_recomendada:s.acao_recomendada||'',
    fonte:s.fonte||'', done:false
  }));
  const momentoTags = Array.from(new Set(sinais.map(s=>MOMENTO_LABEL[s.tipo]).filter(Boolean)));
  const segmentoTags = matchSegmento(parsed.setor||'');
  const perfilTags = Array.from(new Set(sinais.map(s=>matchPerfil(s.decisor_provavel)).filter(Boolean)));
  return {
    id:uid('opp'), empresa: parsed.empresa || query, setor: parsed.setor || '', resumo: parsed.resumo || '',
    sinais, momentoTags, segmentoTags, perfilTags,
    fitScore: Math.max(0, Math.min(100, Number(parsed.fit_estimado)||0)),
    fitJustificativa: parsed.fit_justificativa || '',
    geradoEm: new Date().toISOString(), status:'novo'
  };
}
async function researchOpportunity(query){
  const response = await fetch('/api/anthropic', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6', max_tokens:1000,
      messages:[{role:'user', content: buildResearchPrompt(query)}],
      tools:[{type:'web_search_20250305', name:'web_search'}]
    })
  });
  if(!response.ok) throw new Error('falha na API');
  const data = await response.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const cleaned = text.replace(/```json|```/g,'').trim();
  const match = cleaned.match(/\{[\s\S]*\}/);
  if(!match) throw new Error('resposta sem JSON válido');
  return normalizeOpportunity(JSON.parse(match[0]), query);
}

function computeHomeStats(){
  const opps = opportunitiesActive();
  const segmentos = new Set(); const decisores = new Set(); let sinais=0; let prontas=0;
  opps.forEach(o=>{
    (o.segmentoTags||[]).forEach(s=>segmentos.add(s));

}
function topN(counterMap, n){
  return Object.entries(counterMap).sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>e[0]);
}
function computePlano(){
  const opps = opportunitiesActive();
  const segCount = {}, perfilCount = {}, tipoCount = {}, canalCount = {};
  opps.forEach(o=>{
    (o.segmentoTags||[]).forEach(s=>segCount[s]=(segCount[s]||0)+1);
    (o.perfilTags||[]).forEach(p=>perfilCount[p]=(perfilCount[p]||0)+1);
    (o.sinais||[]).forEach(s=>{
      if(s.tipo) tipoCount[s.tipo]=(tipoCount[s.tipo]||0)+1;
      if(s.fonte){
        try{
          const host = new URL(s.fonte).hostname.replace('www.','');
          let cat = 'Sites';
          if(host.includes('linkedin')) cat='LinkedIn';
          else if(host.includes('youtube')) cat='YouTube';
          else if(host.includes('instagram')) cat='Instagram';
          canalCount[cat]=(canalCount[cat]||0)+1;
        }catch(e){}
      }
    });
  });
  const segmentos = topN(segCount,3);
  const decisores = topN(perfilCount,3);
  const sinaisPrioritarios = topN(tipoCount,4).map(k=>MOMENTO_LABEL[k]).filter(Boolean);
  let canais = Object.entries(canalCount).sort((a,b)=>b[1]-a[1]);
  if(canais.length===0) canais = [['LinkedIn',10],['Sites',6],['Eventos',5],['Podcasts',4]];
  const maxCanal = Math.max(...canais.map(c=>c[1]));
  const funil = computeFunilNiveis();
  const prospectsPrioritarios = opps.filter(o=>(o.fitScore||0)>=70).length;
  const aquecimento = funil[1]+funil[2]+funil[3];

  const conteudosRecomendados = Math.min(6, Math.max(2, Math.ceil((prospectsPrioritarios||opps.length||1)/3)));
  const topSeg = segmentos[0] || 'B2B';
  const topDecisor = decisores[0] || 'decisores relevantes';
  return {
    objetivo:`Encontrar empresas ${segmentos.length?segmentos.join(' · '):'em expansão'} com sinais de ${(sinaisPrioritarios[0]||'crescimento').toLowerCase()} e acesso a ${topDecisor}.`,
    segmentos: segmentos.length?segmentos:['—'],
    decisores: decisores.length?decisores:['—'],

    canais: canais.map(c=>({nome:c[0], valor:c[1], pct: Math.round((c[1]/maxCanal)*100)})),

    proximaAcao:`Pesquisar mais empresas em "${topSeg}" e mapear os decisores (${topDecisor}) de cada uma.`
  };
}

async function runResearchFlow(){
  const input = document.getElementById('researchInput');
  const log = document.getElementById('researchLog');
  const btn = document.getElementById('researchBtn');
  const queries = input.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5);
  if(queries.length===0){ input.focus(); return; }
  btn.disabled = true; log.innerHTML = '';
  for(let i=0;i<queries.length;i++){
    const q = queries[i];
    const line = document.createElement('div');
    line.textContent = `Pesquisando "${q}"… (${i+1}/${queries.length})`;
    log.appendChild(line);
    try{
      const opp = await researchOpportunity(q);
      line.textContent = `✓ ${q} — ${opp.sinais.length} sinal(is) encontrado(s)`;
      line.className = 'ok';
      state.radar.push(opp);
      saveRadar();
    }catch(e){
      line.textContent = `Não consegui pesquisar "${q}" agora (${e.message||'erro de conexão'}).`;
      line.className = 'err';
    }
  }
  btn.disabled = false; input.value = '';
  renderInteligencia(document.getElementById('mainArea'));
}

      opps = opps.filter(o=>(o[tagKey]||[]).some(t=>set.has(t)));

function openMoveToProspects(o){
  const primeiro = (o.sinais||[])[0];
  const nome = window.prompt(`Nome do contato em ${o.empresa} (pode deixar em branco):`, primeiro ? primeiro.decisor_provavel : '');

  const frontLabels = FRONTS.map((f,i)=>`${i+1}. ${f.label}`).join('\n');
  const choice = window.prompt(`Para qual frente mover?\n${frontLabels}\n\nDigite o número:`, '1');
  if(choice===null) return;
  const idx = Math.max(0, Math.min(FRONTS.length-1, (parseInt(choice,10)||1)-1));
  addContactFromOpportunity(FRONTS[idx].id, o, nome);
  o.status = 'movido'; saveRadar();
  alert(`Contato adicionado em "${FRONTS[idx].label}" como nível Consultivo, com observação e hipótese pré-preenchidas.`);
  renderRadarList();
}

function buildGanchosPrompt(nome, cargo, empresa){
  return `Você é um analista de inteligência comercial. Pesquise na web informações reais e atuais sobre "${nome}"${cargo?`, ${cargo}`:''}${empresa?` na empresa ${empresa}`:''}.

Gere ganchos de conversa reais (nunca invente fatos). Se não encontrar nada confiável sobre a pessoa, baseie-se no momento da empresa.

Responda apenas com um JSON válido, sem texto antes ou depois, neste formato exato:
{"ganchos":[
  {"categoria":"conteudo_recente","titulo":"...","texto":"...(o que foi encontrado + sugestão de comentário)"},
  {"categoria":"movimento","titulo":"...","texto":"...(movimento da empresa + ângulo de conversa)"},
  {"categoria":"hipotese_dor","titulo":"...","texto":"...(hipótese de dor + pergunta sugerida)"},
  {"categoria":"autoridade","titulo":"...","texto":"...(tema que valeria a pena publicar sobre isso)"}
]}
Máximo 1 item por categoria, textos curtos (até 30 palavras).`;
}
const GANCHO_CAT_LABEL = {conteudo_recente:'Conteúdo recente', movimento:'Movimento', hipotese_dor:'Hipótese de dor', autoridade:'Autoridade'};
async function generateGanchos(nome, cargo, empresa){
  const response = await fetch('/api/anthropic', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6', max_tokens:1000,
      messages:[{role:'user', content: buildGanchosPrompt(nome, cargo, empresa)}],
      tools:[{type:'web_search_20250305', name:'web_search'}]
    })
  });
  if(!response.ok) throw new Error('falha na API');
  const data = await response.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const cleaned = text.replace(/```json|```/g,'').trim();
  const match = cleaned.match(/\{[\s\S]*\}/);
  if(!match) throw new Error('resposta sem JSON válido');
  const parsed = JSON.parse(match[0]);
  return (parsed.ganchos||[]).map(g=>({categoria:g.categoria||'outro', titulo:g.titulo||'', texto:g.texto||''}));
}

      <div class="gancho-titulo">${escapeHtml(g.titulo)}</div>

}

      state.section='mensagens'; state.activeFrontId=frontId; state.activeContactByFront[frontId]=contactId;
      renderSection();
    });
  });
}

let isDark = true;
function toggleTheme(){
  isDark = !isDark;
  document.documentElement.style.setProperty('--void', isDark ? '#050810' : '#F3F6FB');
  document.documentElement.style.setProperty('--panel', isDark ? '#0A1220' : '#FFFFFF');
  document.documentElement.style.setProperty('--panel-alt', isDark ? '#0D1830' : '#F8FAFC');
  document.documentElement.style.setProperty('--panel-line', isDark ? 'rgba(99,169,255,0.16)' : 'rgba(15,40,80,0.12)');
  document.documentElement.style.setProperty('--blue', isDark ? '#2F7FFF' : '#1A5FD7');
  document.documentElement.style.setProperty('--blue-bright', isDark ? '#6FB1FF' : '#2F7FFF');
  document.documentElement.style.setProperty('--blue-deep', isDark ? '#0B3B8C' : '#E8F0FE');
  document.documentElement.style.setProperty('--white', isDark ? '#F3F6FB' : '#0A1220');
  document.documentElement.style.setProperty('--mute', isDark ? '#8996AC' : '#3A4255');
  document.documentElement.style.setProperty('--mute-dim', isDark ? '#5C6880' : '#7B869A');
  document.documentElement.style.setProperty('--green', isDark ? '#3ED598' : '#0D8A5C');
  document.documentElement.style.setProperty('--purple', isDark ? '#C9A6FF' : '#5B2D8C');
  document.documentElement.style.setProperty('--orange', isDark ? '#FF8A66' : '#B02A10');
  document.body.style.background = isDark ? 'var(--void)' : 'var(--panel-alt)';
  localStorage.setItem('prospect_theme', isDark ? 'dark' : 'light');
}
function loadTheme(){
  const t = localStorage.getItem('prospect_theme');
  if(t === 'light') toggleTheme();
}

function init(){
  document.getElementById('hamburger').addEventListener('click', ()=>{ state.mobileOpen = !state.mobileOpen; renderRail(); });
  document.getElementById('railBackdrop').addEventListener('click', ()=>{ state.mobileOpen = false; renderRail(); });
  document.getElementById('prospectModalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='prospectModalBackdrop') closeProspectPanel(); });
  renderSection();
  loadTheme();
  loadAll();
}

async function sendEmail(to, subject, body){
  try{
    const r = await fetch('/api/send-email', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({to, subject, body})});
    if(!r.ok) throw new Error('Falha no envio');
    alert('E-mail enviado.');
  }catch(e){ alert('Erro ao enviar e-mail: ' + (e.message||e)); }
}
async function sendWhatsApp(to, body, groupId){
  try{
    const r = await fetch('/api/send-whatsapp', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({to, body, group_id: groupId||null})});
    if(!r.ok) throw new Error('Falha no envio');
    alert('WhatsApp enviado.');
  }catch(e){ alert('Erro ao enviar WhatsApp: ' + (e.message||e)); }
}

function renderMensagens(el){
  el.innerHTML = `
    <div class="eyebrow"><span class="node-dot"></span>Mensagens</div>
    <div class="front-tabs" id="frontTabs"></div>
    <div class="front-head">
      <div class="eyebrow" id="frontEyebrow"></div>
      <h2 class="display front-title" id="frontTitle" style="text-align:left;"></h2>
      <p class="front-desc" id="frontDesc"></p>
      <a href="#" target="_blank" rel="noopener" class="front-link" id="frontLink"></a>
    </div>
    <div id="warnBanner"></div>
    <div id="caseBuilder"></div>
    <div class="cards" id="cards"></div>
    <div class="contacts-panel" id="contactsPanel"></div>
    <div class="contacts-panel" style="margin-top:16px;">
      <div class="contacts-head"><h3>Disparos</h3></div>
      <div class="contact-form" style="flex-direction:column;align-items:stretch;">
        <input type="text" id="dispatchTo" placeholder="E-mail ou WhatsApp, ex: flavio@email.com ou 5521999999999">
        <button class="btn-primary" id="dispatchEmailBtn">Enviar apresentação por e-mail</button>
        <button class="btn-primary" id="dispatchWhatsAppBtn" style="background:var(--green);color:var(--void);">Enviar apresentação por WhatsApp</button>
        <div class="research-log" id="dispatchLog"></div>
      </div>
    </div>
  `;
  renderFrontTabs();
  renderMensagensContent();
  const dispatchTo = document.getElementById('dispatchTo');
  const emailBtn = document.getElementById('dispatchEmailBtn');
  const waBtn = document.getElementById('dispatchWhatsAppBtn');
  const dispatchLog = document.getElementById('dispatchLog');
  const apCard = document.getElementById('card-apresentacao');
  const bodyText = apCard ? apCard.querySelector('.card-body').textContent : '';
  if(emailBtn){
    emailBtn.addEventListener('click', async ()=>{
      const to = (dispatchTo.value||'').trim();
      if(!to){ dispatchTo.focus(); return; }
      dispatchLog.textContent = 'Enviando e-mail...'; dispatchLog.className='';
      await sendEmail(to, 'Apresentação', bodyText);
      dispatchLog.textContent = 'E-mail enviado.'; dispatchLog.className='ok';
    });
  }
  if(waBtn){
    waBtn.addEventListener('click', async ()=>{
      const to = (dispatchTo.value||'').trim();
      if(!to){ dispatchTo.focus(); return; }
      dispatchLog.textContent = 'Enviando WhatsApp...'; dispatchLog.className='';
      await sendWhatsApp(to, bodyText, null);
      dispatchLog.textContent = 'WhatsApp enviado.'; dispatchLog.className='ok';
    });
  }
}
init();

</script>
